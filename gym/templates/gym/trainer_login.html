<!DOCTYPE html>
<html>

<head>

    <title>Trainer Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #111827,
                #e03b49
            );
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }

        .login-box p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 13px;

            background: #e71c1c;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #111113;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 10px;
            border-radius: 7px;

            margin-bottom: 20px;
            text-align: center;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>Trainer Login</h1>

        <p>Gym Fitness Management System</p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>

    </div>

</body>

</html>
